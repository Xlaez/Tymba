name: Deploy demo metadata to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - public/devnet-token-metadata.json
      - public/devnet-token-metadata.svg
      - .github/workflows/deploy-demo-metadata.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare metadata site
        run: |
          mkdir -p _site
          cp public/devnet-token-metadata.json public/devnet-token-metadata.svg _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
